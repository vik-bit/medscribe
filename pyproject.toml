[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medscribe"
version = "0.1.0"
description = "Clinical ASR fine-tuning (Whisper + LoRA) and a from-scratch multi-agent note-writing orchestrator, evaluated on PriMock57."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bikram Mohanty" }]
dependencies = [
  "pydantic>=2.5",
  "httpx>=0.27",
  "numpy>=1.24",
  "jiwer>=3.0",
]

[project.optional-dependencies]
asr = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.11",
  "accelerate>=0.30",
  "soundfile>=0.12",
  "scipy>=1.10",
]
langgraph = ["langgraph>=1.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
medscribe = "medscribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
