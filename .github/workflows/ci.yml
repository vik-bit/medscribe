name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # Core + dev (+ LangGraph for the framework comparison): unit tests use a
      # synthetic fixture and a scripted LLM, so no model weights, GPU, dataset
      # download or network LLM are needed.
      - run: pip install -e ".[dev,langgraph]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
